  <line x1="100" y1="161.3" x2="520" y2="460" stroke="#9a6700" stroke-width="3" stroke-dasharray="8 6"/>
  <polyline points="100,161.3 128,166.7 156,204 184,230.7 212,257.3 240,278.7 268,278.7 296,326.7 324,326.7 352,385.3 380,385.3 408,385.3 436,438.7 464,438.7 492,438.7 520,460" fill="none" stroke="#005ea8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
