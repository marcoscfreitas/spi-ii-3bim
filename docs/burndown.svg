<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Burndown das Sprints 1 e 2</title>
  <desc id="desc">A Sprint 1 iniciou com 56 story points e terminou com zero. A Sprint 2 iniciou com 57 story points, recebeu mais 2 pontos de escopo em 9 de outubro de 2026 e terminou com 59 de 59 pontos concluídos. A linha real registra o saldo ao fim de cada dia.</desc>

  <rect width="1200" height="720" fill="#f7f9fb"/>
  <text x="60" y="48" fill="#17212b" font-family="Arial, sans-serif" font-size="26" font-weight="700">Burndown das Sprints 1 e 2</text>
  <text x="60" y="76" fill="#536270" font-family="Arial, sans-serif" font-size="15">Story points restantes por dia · corte em 09/10/2026</text>

  <line x1="750" y1="48" x2="790" y2="48" stroke="#005ea8" stroke-width="4"/>
  <circle cx="770" cy="48" r="5" fill="#005ea8"/>
  <text x="800" y="53" fill="#273744" font-family="Arial, sans-serif" font-size="14">Real</text>
  <line x1="870" y1="48" x2="910" y2="48" stroke="#9a6700" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="920" y="53" fill="#273744" font-family="Arial, sans-serif" font-size="14">Ideal linear</text>
  <rect x="1030" y="37" width="24" height="18" rx="3" fill="#e8edf1"/>
  <text x="1064" y="53" fill="#273744" font-family="Arial, sans-serif" font-size="14">Futuro</text>

  <rect x="50" y="92" width="510" height="400" rx="10" fill="#ffffff" stroke="#cbd5df"/>
  <rect x="630" y="92" width="520" height="400" rx="10" fill="#ffffff" stroke="#cbd5df"/>
  <text x="80" y="122" fill="#17212b" font-family="Arial, sans-serif" font-size="18" font-weight="700">Sprint 1 · 12–26/09</text>
  <text x="660" y="122" fill="#17212b" font-family="Arial, sans-serif" font-size="18" font-weight="700">Sprint 2 · 27/09–11/10</text>

  <!-- Grade e eixos da Sprint 1. A escala comum vai de 0 a 60 SP. -->
  <g stroke="#e2e8ee" stroke-width="1">
    <line x1="100" y1="140" x2="520" y2="140"/>
    <line x1="100" y1="220" x2="520" y2="220"/>
    <line x1="100" y1="300" x2="520" y2="300"/>
    <line x1="100" y1="380" x2="520" y2="380"/>
    <line x1="100" y1="460" x2="520" y2="460"/>
    <line x1="680" y1="140" x2="1100" y2="140"/>
    <line x1="680" y1="220" x2="1100" y2="220"/>
    <line x1="680" y1="300" x2="1100" y2="300"/>
    <line x1="680" y1="380" x2="1100" y2="380"/>
    <line x1="680" y1="460" x2="1100" y2="460"/>
  </g>
  <g fill="#62717f" font-family="Arial, sans-serif" font-size="12" text-anchor="end">
    <text x="90" y="144">60</text>
    <text x="90" y="224">45</text>
    <text x="90" y="304">30</text>
    <text x="90" y="384">15</text>
    <text x="90" y="464">0</text>
    <text x="670" y="144">60</text>
    <text x="670" y="224">45</text>
    <text x="670" y="304">30</text>
    <text x="670" y="384">15</text>
    <text x="670" y="464">0</text>
  </g>

