    <text x="380" y="480">21</text><text x="464" y="480">24</text><text x="520" y="480">26</text>
  </g>
  <rect x="470" y="410" width="62" height="26" rx="13" fill="#e8f2fb"/>
  <text x="501" y="428" fill="#004b87" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">0 SP</text>

  <!-- Sprint 2: linha-base de 57 SP; escopo final de 59 SP após +2 em 09/10; saldo real ao fim de cada dia: 57,49,49,49,32,32,32,32,11,11,3,3,3,0. -->
  <rect x="1058" y="140" width="42" height="320" fill="#e8edf1" opacity="0.75"/>
  <line x1="680" y1="156" x2="1100" y2="460" stroke="#9a6700" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="1044" y1="140" x2="1044" y2="460" stroke="#6f7c87" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="1036" y="176" fill="#536270" font-family="Arial, sans-serif" font-size="11" text-anchor="end">corte 09/10</text>
  <polyline points="680,156 708,198.7 736,198.7 764,198.7 792,289.3 820,289.3 848,289.3 876,289.3 904,401.3 932,401.3 960,444 988,444 1016,444 1044,460" fill="none" stroke="#005ea8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#005ea8">
