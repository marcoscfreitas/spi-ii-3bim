  <g fill="#62717f" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">
    <text x="680" y="480">início</text><text x="708" y="480">27</text><text x="792" y="480">30</text><text x="876" y="480">03</text>
    <text x="960" y="480">06</text><text x="1044" y="480">09</text><text x="1100" y="480">11</text>
  </g>
  <rect x="1007" y="411" width="74" height="26" rx="13" fill="#e8f2fb"/>
  <text x="1044" y="429" fill="#004b87" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">0 SP</text>
  <text x="1036" y="393" fill="#536270" font-family="Arial, sans-serif" font-size="11" text-anchor="end">+2 SP no escopo; 5 SP concluídos</text>

  <rect x="50" y="520" width="340" height="105" rx="10" fill="#ffffff" stroke="#cbd5df"/>
  <text x="72" y="550" fill="#536270" font-family="Arial, sans-serif" font-size="13">Sprint 1</text>
  <text x="72" y="585" fill="#17212b" font-family="Arial, sans-serif" font-size="28" font-weight="700">56/56 SP</text>
  <text x="72" y="609" fill="#2e6b45" font-family="Arial, sans-serif" font-size="13">concluída em 26/09</text>

  <rect x="430" y="520" width="340" height="105" rx="10" fill="#ffffff" stroke="#cbd5df"/>
  <text x="452" y="550" fill="#536270" font-family="Arial, sans-serif" font-size="13">Sprint 2</text>
  <text x="452" y="585" fill="#17212b" font-family="Arial, sans-serif" font-size="28" font-weight="700">59/59 SP</text>
  <text x="452" y="609" fill="#2e6b45" font-family="Arial, sans-serif" font-size="13">concluída em 09/10</text>

  <rect x="810" y="520" width="340" height="105" rx="10" fill="#ffffff" stroke="#cbd5df"/>
  <text x="832" y="550" fill="#536270" font-family="Arial, sans-serif" font-size="13">Escopo considerado</text>
  <text x="832" y="581" fill="#17212b" font-family="Arial, sans-serif" font-size="19" font-weight="700">115 SP obrigatórios</text>
  <text x="832" y="609" fill="#536270" font-family="Arial, sans-serif" font-size="13">BONUS-01 excluída do cálculo</text>

  <text x="60" y="665" fill="#536270" font-family="Arial, sans-serif" font-size="12">Fonte: backlog_sprints.md, acompanhamento da Sprint 1 e histórico Git sem commits de merge.</text>
  <text x="60" y="686" fill="#536270" font-family="Arial, sans-serif" font-size="12">Sprint 2: linha-base de 57 SP e escopo final de 59 SP após a inclusão de PROJ-72 em 09/10.</text>
